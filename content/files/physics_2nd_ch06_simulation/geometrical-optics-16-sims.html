<script>
// ===== Shared optics drawing library (video + interactive) =====
const COL = {
  bg: '#0f2236', board: '#132b44', panel: 'rgba(255,255,255,0.06)', line: '#c9d6e6', dim: '#6f88a3',
  ray: '#ffd23f', ray2: '#ff8a5b', normal: '#8fb3d9', glass: 'rgba(120,200,235,0.22)', glassEdge: '#7cc6e6',
  water: 'rgba(80,150,230,0.20)', obj: '#7aa7ff', img: '#5ee3a1', virt: '#5ee3a1', text: '#eef3f8',

let FONT = '"Noto Serif Bengali","FreeSerif",serif';
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function setFont(ctx, size, bold = false) { ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; }

function text(ctx, s, x, y, o = {}) {

// draw polyline progressively, arrowheads at middle of each segment (glowing ray)
function ray(ctx, pts, p = 1, o = {}) {

    ctx.lineTo(x, y);

    rem -= d;

function dot(ctx, x, y, r = 5, color = COL.text, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}

function rrect(ctx, x, y, w, h, r = 12, fill = COL.panel, stroke = null, alpha = 1, lw = 1.5) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath();

}

// angle arc between two directions (radians, canvas coords) from center
function angArc(ctx, cx, cy, a1, a2, r, color, label, o = {}) {
  const { alpha = 1, size = 22 } = o; if (alpha <= 0) return;
  let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  ctx.arc(cx, cy, r, a1, a1 + d, d < 0); ctx.stroke(); ctx.restore();

}

// ---------- mini formula renderer ----------
// syntax:  \f{num}{den}   _{sub}   ^{sup}
function parseF(s) {
  let i = 0;
  function group() { // expects '{'
    i++; const out = seq('}'); i++; return out;
  }
  function seq(end) {
    const nodes = []; let buf = '';
    const flush = () => { if (buf) { nodes.push({ t: 'txt', s: buf }); buf = ''; } };
    while (i < s.length && s[i] !== end) {
      if (s.startsWith('\\f{', i)) { flush(); i += 2; const n = group(); const d = group(); nodes.push({ t: 'frac', n, d }); }
      else if ((s[i] === '_' || s[i] === '^') && s[i + 1] === '{') { flush(); const k = s[i]; i++; const g = group(); nodes.push({ t: k === '_' ? 'sub' : 'sup', g }); }
      else { buf += s[i]; i++; }

  }

}
function measureNodes(ctx, nodes, size) {
  let w = 0, up = size * 0.8, dn = size * 0.25;
  for (const n of nodes) {
    if (n.t === 'txt') { setFont(ctx, size); w += ctx.measureText(n.s).width; }
    else if (n.t === 'sub' || n.t === 'sup') { const m = measureNodes(ctx, n.g, size * 0.62); w += m.w + 1; if (n.t === 'sub') dn = Math.max(dn, size * 0.45); else up = Math.max(up, size * 1.0); }
    else if (n.t === 'frac') { const a = measureNodes(ctx, n.n, size * 0.86), b = measureNodes(ctx, n.d, size * 0.86); w += Math.max(a.w, b.w) + size * 0.3; up = Math.max(up, a.up + a.dn + size * 0.35); dn = Math.max(dn, b.up + b.dn + size * 0.05); }
  }
  return { w, up, dn };
}
function drawNodes(ctx, nodes, x, y, size, color) {
  for (const n of nodes) {
    if (n.t === 'txt') { setFont(ctx, size); ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(n.s, x, y); x += ctx.measureText(n.s).width; }
    else if (n.t === 'sub') { const s2 = size * 0.62; x = drawNodes(ctx, n.g, x, y + size * 0.28, s2, color) + 1; }
    else if (n.t === 'sup') { const s2 = size * 0.62; x = drawNodes(ctx, n.g, x, y - size * 0.42, s2, color) + 1; }
    else if (n.t === 'frac') {
      const s2 = size * 0.86, a = measureNodes(ctx, n.n, s2), b = measureNodes(ctx, n.d, s2), W = Math.max(a.w, b.w) + size * 0.15;
      const barY = y - size * 0.3;
      drawNodes(ctx, n.n, x + (W - a.w) / 2 + size * 0.07, barY - a.dn - size * 0.12, s2, color);
      drawNodes(ctx, n.d, x + (W - b.w) / 2 + size * 0.07, barY + b.up + size * 0.08, s2, color);
      ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, size / 16); ctx.beginPath(); ctx.moveTo(x + size * 0.04, barY); ctx.lineTo(x + W + size * 0.1, barY); ctx.stroke(); ctx.restore();

}
function fx(ctx, s, x, y, o = {}) {
  const { size = 34, color = COL.text, align = 'left', alpha = 1 } = o; if (alpha <= 0) return 0;
  const nodes = parseF(s); const m = measureNodes(ctx, nodes, size);
  let x0 = x; if (align === 'center') x0 = x - m.w / 2; else if (align === 'right') x0 = x - m.w;
  ctx.save(); ctx.globalAlpha *= alpha; drawNodes(ctx, nodes, x0, y, size, color); ctx.restore(); return m.w;
}

// ---------- physics helpers ----------
function refractDir(d, n, eta) { // d unit incident, n unit normal pointing toward incident side, eta=n1/n2
  const cosi = -(d[0] * n[0] + d[1] * n[1]); const k = 1 - eta * eta * (1 - cosi * cosi);
  if (k < 0) return null; const a = eta * cosi - Math.sqrt(k); return [eta * d[0] + a * n[0], eta * d[1] + a * n[1]];
}
function reflectDir(d, n) { const k = 2 * (d[0] * n[0] + d[1] * n[1]); return [d[0] - k * n[0], d[1] - k * n[1]]; }
function segIntersect(p, d, a, b) { // ray p + t d with segment a-b, return [t,s]
  const ex = b[0] - a[0], ey = b[1] - a[1]; const den = d[0] * ey - d[1] * ex; if (Math.abs(den) < 1e-9) return null;
  const t = ((a[0] - p[0]) * ey - (a[1] - p[1]) * ex) / den; const s = ((a[0] - p[0]) * d[1] - (a[1] - p[1]) * d[0]) / den;
  return [t, s];
}
// prism trace: apex, left base, right base; incidence angle i (deg) at point fraction q along left face from apex
function prismTrace(P, iDeg, mu, q = 0.55, Lin = 260, Lout = 300) {
  const [T, BL, BR] = P;
  const hit = [lerp(T[0], BL[0], q), lerp(T[1], BL[1], q)];
  const fx_ = BL[0] - T[0], fy_ = BL[1] - T[1], fl = Math.hypot(fx_, fy_);
  let nOut = [fy_ / fl, -fx_ / fl]; // perpendicular; make it point outward (away from centroid)
  const C = [(T[0] + BL[0] + BR[0]) / 3, (T[1] + BL[1] + BR[1]) / 3];
  if ((hit[0] - C[0]) * nOut[0] + (hit[1] - C[1]) * nOut[1] < 0) nOut = [-nOut[0], -nOut[1]];
  const nIn = [-nOut[0], -nOut[1]];

  const i = iDeg * D2R; const rot = (v, a) => [v[0] * Math.cos(a) - v[1] * Math.sin(a), v[0] * Math.sin(a) + v[1] * Math.cos(a)];
  let d = rot(nIn, -i); // tilt so the ray rises toward the base side -> classic picture
  const start = [hit[0] - d[0] * Lin, hit[1] - d[1] * Lin];
  const din = refractDir(d, nOut, 1 / mu);
  const tt = segIntersect(hit, din, T, BR); if (!tt) return null;
  const hit2 = [hit[0] + din[0] * tt[0], hit[1] + din[1] * tt[0]];
  const gx = BR[0] - T[0], gy = BR[1] - T[1], gl = Math.hypot(gx, gy);
  let n2 = [gy / gl, -gx / gl]; if ((hit2[0] - C[0]) * n2[0] + (hit2[1] - C[1]) * n2[1] < 0) n2 = [-n2[0], -n2[1]];
  const dout = refractDir(din, [-n2[0], -n2[1]], mu);

  if (!dout) return { start, hit, hit2, d, din, dout: null, nOut, n2, r1, tir: true };
  const end = [hit2[0] + dout[0] * Lout, hit2[1] + dout[1] * Lout];
  const dev = Math.acos(clamp(d[0] * dout[0] + d[1] * dout[1], -1, 1)) * R2D;

}
function prismDev(iDeg, mu, A) { const r1 = Math.asin(Math.sin(iDeg * D2R) / mu) * R2D, r2 = A - r1; const s = mu * Math.sin(r2 * D2R); if (s > 1) return null; const i2 = Math.asin(s) * R2D; return { r1, r2, i2, dev: iDeg + i2 - A }; }

// ---------- lens helpers (real-is-positive: 1/u + 1/v = 1/f, m = -v/u) ----------
function lensImage(u, f) { if (Math.abs(u - f) < 1e-6) return { v: Infinity, m: Infinity }; const v = u * f / (u - f); return { v, m: -v / u }; }
function drawLens(ctx, x, y, h, convex = true, o = {}) {
  const { alpha = 1, bulge = 22 } = o; ctx.save(); ctx.globalAlpha *= alpha; ctx.beginPath();
  if (convex) { ctx.moveTo(x, y - h); ctx.quadraticCurveTo(x + bulge * 2, y, x, y + h); ctx.quadraticCurveTo(x - bulge * 2, y, x, y - h); }
  else { const e = 16; ctx.moveTo(x - e, y - h); ctx.lineTo(x + e, y - h); ctx.quadraticCurveTo(x + 2, y, x + e, y + h); ctx.lineTo(x - e, y + h); ctx.quadraticCurveTo(x - 2, y, x - e, y - h); }

}
function objArrow(ctx, x, y0, h, color, o = {}) {
  const { alpha = 1, dash = null, w = 4 } = o; if (alpha <= 0 || !isFinite(x) || !isFinite(h)) return;
  line(ctx, x, y0, x, y0 - h, { color, w, dash, alpha }); arrowHead(ctx, x, y0 - h, h > 0 ? -Math.PI / 2 : Math.PI / 2, color, 14, alpha);
}
// line through two points clipped to x-range
function extend(p, q, x) { const k = (x - p[0]) / (q[0] - p[0]); return [x, p[1] + (q[1] - p[1]) * k]; }

// wrap text into lines (Bangla-safe: breaks on spaces only)
function wrap(ctx, s, maxW, size, bold = false) {
  setFont(ctx, size, bold); const words = s.split(' '); const out = []; let cur = '';

function para(ctx, s, x, y, maxW, o = {}) {
  const { size = 24, lh = 1.45, color = COL.text, bold = false, alpha = 1 } = o;

// ===== 16 simulations — Chapter 6 only =====
const fmt = (x, d = 2) => Number.isFinite(x) ? (+x.toFixed(d)).toString() : '∞';
function clearC(ctx, w, h) {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, w, h); ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); } ctx.restore();
}
const S = (k, label, min, max, step, val, unit = '') => ({ k, label, min, max, step, val, unit });
const SEG = (k, label, opts, val) => ({ k, label, type: 'seg', opts, val });
function lensMarks(ctx, X0, Y0, fpx, conv, sz = 15) {
  const lab = conv ? ['2F₁', 'F₁', 'F₂', '2F₂'] : ['2F₂', 'F₂', 'F₁', '2F₁'];
  [[-2, lab[0]], [-1, lab[1]], [1, lab[2]], [2, lab[3]]].forEach(([k, l]) => { const xx = X0 + k * fpx; if (xx > 8 && xx < 792) { dot(ctx, xx, Y0, 4); text(ctx, l, xx, Y0 + 24, { size: sz, align: 'center' }); } });
  dot(ctx, X0, Y0, 4, COL.accent); text(ctx, 'O', X0 + 8, Y0 - 8, { size: 15, color: COL.accent });
}
function graphAxes(g, gx, gy, gw, gh, xl, yl, xr, yr, xt, yt) {
  const X = v => gx + (v - xr[0]) / (xr[1] - xr[0]) * gw, Y = v => gy - (v - yr[0]) / (yr[1] - yr[0]) * gh;

  note: '1/f = (μ_লেন্স/μ_মাধ্যম − 1)(1/r₁ − 1/r₂)। উভোত্তল: r₁ (+), r₂ (−)। কাচের লেন্স পানিতে নিলে f প্রায় ৪ গুণ হয়। মাধ্যমের μ লেন্সের চেয়ে বেশি হলে উত্তল লেন্স অবতলের মতো আচরণ করে!',
  draw(ctx, V) {
    const R = V.R, map = { bx: [R, -R], px: [R, Infinity], bv: [-R, R], pv: [-R, Infinity] }, [r1, r2] = map[V.sh];
    const k = V.ml / V.mm - 1, inv = k * (1 / r1 - (Number.isFinite(r2) ? 1 / r2 : 0)), f = Math.abs(inv) < 1e-9 ? Infinity : 1 / inv;
    const X0 = 380, Y0 = 200, s = Number.isFinite(f) ? 280 / Math.min(Math.max(Math.abs(f), 20), 400) : 1;
    ctx.fillStyle = `rgba(80,150,230,${0.05 + 0.25 * (V.mm - 1) / 0.9})`; ctx.fillRect(0, 0, 800, 400);
    line(ctx, 0, Y0, 800, Y0, { color: COL.dim, w: 1.5 });
    const convexShape = V.sh === 'bx' || V.sh === 'px'; drawLens(ctx, X0, Y0, 140, convexShape);
    let o = [['r₁ , r₂', fmt(r1, 1) + ' , ' + (Number.isFinite(r2) ? fmt(r2, 1) : '∞') + ' cm'], ['(μ_লেন্স/μ_মাধ্যম − 1)', fmt(k, 4)]];
    for (const yy of [-90, -45, 45, 90]) {
      if (!Number.isFinite(f)) { ray(ctx, [[20, Y0 + yy], [780, Y0 + yy]], 1, { w: 2, arrows: false }); continue; }
      const F = [X0 + f * s, Y0];
      if (f > 0) ray(ctx, [[20, Y0 + yy], [X0, Y0 + yy], F, extend([X0, Y0 + yy], F, 790)], 1, { w: 2, arrows: false });
      else { ray(ctx, [[20, Y0 + yy], [X0, Y0 + yy], extend(F, [X0, Y0 + yy], 790)], 1, { w: 2, arrows: false }); line(ctx, X0, Y0 + yy, F[0], F[1], { color: COL.ray, dash: [6, 5], alpha: .7 }); }
    }
    if (Number.isFinite(f)) { const Fx = X0 + f * s; if (Fx > 0 && Fx < 800) { dot(ctx, Fx, Y0, 6, COL.accent); text(ctx, 'F', Fx, Y0 + 26, { size: 16, align: 'center', bold: true }); } }
    o.push(['ফোকাস দূরত্ব f', fmt(f, 2) + ' cm'], ['আচরণ', !Number.isFinite(f) ? 'কোনো বাঁকানো নেই (μ সমান)' : (f > 0 ? 'অভিসারী (উত্তলের মতো)' : 'অপসারী (অবতলের মতো)')]);
    if (convexShape && f < 0) o.push(['লক্ষ্য করো', 'উত্তল আকৃতির লেন্স অবতলের মতো কাজ করছে!']);
    return o;
  } },
{ id: 'combo', g: 'লেন্স', name: 'লেন্সের সমবায় (সংস্পর্শে)', h: 380,
  ctrls: [S('p1', '১ম লেন্সের ক্ষমতা P₁', -10, 10, 0.5, 4, ' D'), S('p2', '২য় লেন্সের ক্ষমতা P₂', -10, 10, 0.5, 2, ' D')],
  note: 'সংস্পর্শে থাকা লেন্সের জন্য: P = P₁ + P₂ এবং 1/F = 1/f₁ + 1/f₂। উত্তল (+) ও অবতল (−) মিলিয়ে P = 0 করলে সমবায় সমতল কাচের মতো আচরণ করে।',
  draw(ctx, V) {
    const P = V.p1 + V.p2, F = P ? 100 / P : Infinity, X0 = 400, Y0 = 190, s = Number.isFinite(F) ? 300 / Math.max(Math.abs(F), 10) : 1;
    line(ctx, 0, Y0, 800, Y0, { color: COL.dim, w: 1.5 });
    if (V.p1) drawLens(ctx, X0 - 20, Y0, 130, V.p1 > 0); if (V.p2) drawLens(ctx, X0 + 20, Y0, 130, V.p2 > 0);
    for (const yy of [-90, -45, 45, 90]) {
      if (!Number.isFinite(F)) { ray(ctx, [[20, Y0 + yy], [780, Y0 + yy]], 1, { w: 2, arrows: false }); continue; }
      const Fp = [X0 + F * s, Y0];
      if (F > 0) ray(ctx, [[20, Y0 + yy], [X0, Y0 + yy], Fp, extend([X0, Y0 + yy], Fp, 790)], 1, { w: 2, arrows: false });
      else { ray(ctx, [[20, Y0 + yy], [X0, Y0 + yy], extend(Fp, [X0, Y0 + yy], 790)], 1, { w: 2, arrows: false }); line(ctx, X0, Y0 + yy, Fp[0], Fp[1], { color: COL.ray, dash: [6, 5], alpha: .7 }); }
    }
    if (Number.isFinite(F)) { const Fx = X0 + F * s; if (Fx > 0 && Fx < 800) { dot(ctx, Fx, Y0, 6, COL.accent); text(ctx, 'F', Fx, Y0 + 26, { size: 16, align: 'center', bold: true }); } }
    const fc = p => p ? fmt(100 / p, 1) + ' cm' : '∞';
    return [['f₁', fc(V.p1)], ['f₂', fc(V.p2)], ['তুল্য ক্ষমতা P = P₁ + P₂', fmt(P, 2) + ' D'], ['তুল্য ফোকাস দূরত্ব F', fc(P)], ['সমবায়ের ধরন', P > 0 ? 'অভিসারী (উত্তল)' : (P < 0 ? 'অপসারী (অবতল)' : 'সমতল কাচের মতো')]];
  } },

{ id: 'simple', g: 'বীক্ষণ যন্ত্র', name: 'সরল অণুবীক্ষণ (বিবর্ধক কাচ)', h: 400,
  ctrls: [S('f', 'লেন্সের ফোকাস দূরত্ব f', 2, 25, 0.5, 5, ' cm'), S('D', 'স্পষ্ট দর্শনের ন্যূনতম দূরত্ব D', 15, 50, 0.5, 25, ' cm'), S('a', 'চোখ থেকে লেন্সের দূরত্ব a', 0, 10, 0.5, 0, ' cm')],
  note: 'বিম্ব D দূরত্বে হলে m = 1 + D/f; চোখ a দূরে থাকলে m = 1 + (D−a)/f। f যত ছোট, বিবর্ধন তত বেশি। ক্ষীণদৃষ্টির (D ছোট) চোখে বিম্ব ছোট, দূরদৃষ্টির (D বড়) চোখে বড় দেখায়।',
  draw(ctx, V) {
    const { f, D, a } = V, X0 = 560, Y0 = 250, s = 470 / D, u = D * f / (D + f), m = 1 + D / f, h = 18 / m * 4;
    line(ctx, 0, Y0, 800, Y0, { color: COL.dim, w: 1.5 }); drawLens(ctx, X0, Y0, 130, true); lensMarks(ctx, X0, Y0, f * s, true);
    const ox = X0 - u * s, ix = X0 - D * s, hi = h * m;
    objArrow(ctx, ox, Y0, h, COL.obj); objArrow(ctx, ix, Y0, hi, COL.img, { dash: [6, 5] });
    ray(ctx, [[ox, Y0 - h], [X0, Y0 - h], extend([X0, Y0 - h], [X0 + f * s, Y0], 790)], 1, { w: 2.2 });
    ray(ctx, [[ox, Y0 - h], [X0, Y0], extend([ox, Y0 - h], [X0, Y0], 790)], 1, { w: 2.2, color: '#7cf0d0' });
    line(ctx, X0, Y0 - h, ix, Y0 - hi, { color: COL.ray, dash: [6, 5] }); line(ctx, X0, Y0, ix, Y0 - hi, { color: '#7cf0d0', dash: [6, 5] });
    text(ctx, '👁', X0 + 30 + a * s * 0.5, Y0 + 8, { size: 26 });
    text(ctx, 'অবাস্তব, সোজা, বিবর্ধিত বিম্ব (D দূরত্বে)', Math.max(10, ix), Y0 - hi - 12, { size: 15, color: COL.img });
    return [['বস্তুর দূরত্ব u', fmt(u, 2) + ' cm'], ['m = 1 + D/f', fmt(m, 2)], ['m = 1 + (D−a)/f', fmt(1 + (D - a) / f, 2)], ['লেন্সের ক্ষমতা', fmt(100 / f, 1) + ' D']];
  } },
{ id: 'compound', g: 'বীক্ষণ যন্ত্র', name: 'যৌগিক অণুবীক্ষণ', h: 420,
  ctrls: [S('f0', 'অভিলক্ষ্যের ফোকাস দূরত্ব f₀', 0.5, 3, 0.1, 1, ' cm'), S('fe', 'অভিনেত্রের ফোকাস দূরত্ব fₑ', 2, 8, 0.1, 4, ' cm'), S('k', 'বস্তুর দূরত্ব u₀ (f₀-এর গুণিতক)', 1.05, 1.8, 0.01, 1.2, ' × f₀')],
  note: 'চূড়ান্ত বিম্ব D = 25 cm দূরে ধরে: m = −(v₀/u₀)(1 + D/fₑ), যন্ত্রের দৈর্ঘ্য L = v₀ + uₑ। অভিলক্ষ্য বাস্তব, উল্টো, বিবর্ধিত ১ম বিম্ব দেয়; অভিনেত্র সেটিকে আরও বড় অবাস্তব বিম্বে পরিণত করে। (উল্লম্ব মাপ সাংকেতিক)',
  draw(ctx, V) {
    const D = 25, f0 = V.f0, fe = V.fe, u0 = V.k * f0, v0 = u0 * f0 / (u0 - f0), ue = D * fe / (D + fe), L = v0 + ue, m0 = -v0 / u0, me = 1 + D / fe, m = m0 * me;
    const Y0 = 230, s = 700 / Math.max(D, L + u0 + 1), xE = 750, xI = xE - ue * s, xO = xI - v0 * s, xo = xO - u0 * s, xF = xE - D * s;
    const vs = 170 / Math.abs(m), h = Math.max(6, 1 * vs), hI = h * m0, hF = Math.max(-175, hI * me);
    line(ctx, 0, Y0, 800, Y0, { color: COL.dim, w: 1.5 }); drawLens(ctx, xO, Y0, 60, true, { bulge: 26 }); drawLens(ctx, xE, Y0, 110, true, { bulge: 18 });
    text(ctx, 'অভিলক্ষ্য', xO, Y0 + 80, { size: 14, align: 'center' }); text(ctx, 'অভিনেত্র', xE, Y0 + 128, { size: 14, align: 'center' });
    objArrow(ctx, xo, Y0, h, COL.obj); objArrow(ctx, xI, Y0, hI, COL.ray2); objArrow(ctx, xF, Y0, hF, COL.img, { dash: [6, 5] });
    ray(ctx, [[xo, Y0 - h], [xO, Y0], [xI, Y0 - hI]], 1, { w: 2 }); ray(ctx, [[xo, Y0 - h], [xO, Y0 - h], [xI, Y0 - hI]], 1, { w: 2, color: '#7cf0d0' });
    const dirE = [xE - xI, (Y0) - (Y0 - hI)]; ray(ctx, [[xI, Y0 - hI], [xE, Y0], [xE + 150, Y0 + 150 * hI / (xE - xI)]], 1, { w: 2 });
    line(ctx, xE, Y0, xF, Y0 - hF, { color: COL.ray, dash: [6, 5] });
    text(ctx, '১ম বিম্ব (বাস্তব, উল্টো)', xI, Y0 - hI + 22, { size: 14, align: 'center', color: COL.ray2 }); text(ctx, 'চূড়ান্ত বিম্ব (অবাস্তব)', Math.max(70, xF), Y0 - hF + 24, { size: 14, align: 'center', color: COL.img });
    return [['v₀ (অভিলক্ষ্য থেকে ১ম বিম্ব)', fmt(v0, 2) + ' cm'], ['uₑ (অভিনেত্র থেকে ১ম বিম্ব)', fmt(ue, 2) + ' cm'], ['যন্ত্রের দৈর্ঘ্য L = v₀ + uₑ', fmt(L, 2) + ' cm'], ['m₀ = −v₀/u₀', fmt(m0, 2)], ['mₑ = 1 + D/fₑ', fmt(me, 2)], ['মোট বিবর্ধন m = m₀ × mₑ', fmt(m, 1)]];
  } },
{ id: 'tele', g: 'বীক্ষণ যন্ত্র', name: 'নভো দূরবীক্ষণ', h: 400,
  ctrls: [SEG('mode', 'ফোকাসিং', [['inf', 'অসীমে (স্বাভাবিক দর্শন)'], ['D', 'স্পষ্ট দর্শনের ন্যূনতম দূরত্বে']], 'inf'), S('f0', 'অভিলক্ষ্যের ফোকাস দূরত্ব f₀', 40, 200, 1, 100, ' cm'), S('fe', 'অভিনেত্রের ফোকাস দূরত্ব fₑ', 2, 20, 0.5, 5, ' cm')],
  note: 'অসীমে: m = f₀/fₑ, L = f₀ + fₑ। স্পষ্ট দৃষ্টিতে (D = 25 cm): m = (f₀/fₑ)(1 + fₑ/D), L = f₀ + D·fₑ/(D + fₑ)। বিবর্ধন বাড়াতে: f₀ বাড়াও বা fₑ কমাও।',
  draw(ctx, V) {
    const D = 25, f0 = V.f0, fe = V.fe, inf = V.mode === 'inf', ue = inf ? fe : D * fe / (D + fe), L = f0 + ue, m = inf ? f0 / fe : (f0 / fe) * (1 + fe / D);
    const Y0 = 200, s = 600 / L, xo = 110, xe = xo + L * s, xF = xo + f0 * s, ang = Math.min(0.07, 0.4 / m);
    line(ctx, 0, Y0, 800, Y0, { color: COL.dim, w: 1.5 }); drawLens(ctx, xo, Y0, 120, true); drawLens(ctx, xe, Y0, 60, true, { bulge: 30 });
    text(ctx, 'অভিলক্ষ্য (f₀)', xo, Y0 + 145, { size: 14, align: 'center' }); text(ctx, 'অভিনেত্র (fₑ)', xe, Y0 + 85, { size: 14, align: 'center' });
    const Iy = Y0 + f0 * s * Math.tan(ang); dot(ctx, xF, Iy, 4, COL.ray2); line(ctx, xF, Y0, xF, Iy, { color: COL.ray2, w: 3 });
    for (const yy of [-70, 0, 70]) { const yin = Y0 + yy, sx = 10, sy = yin - (xo - sx) * Math.tan(ang);
      const ye = Iy + (Iy - yin) * (ue * s) / (f0 * s);
      ray(ctx, [[sx, sy], [xo, yin], [xe, ye], [790, ye + (790 - xe) * (Y0 - Iy) / (xe - xF)]], 1, { w: 2, arrows: false }); }
    text(ctx, '১ম বিম্ব (বাস্তব, উল্টো, ছোট)', xF, Iy + 24, { size: 13, align: 'center', color: COL.ray2 });
    return [['বিবর্ধন m', fmt(m, 2)], ['যন্ত্রের দৈর্ঘ্য L', fmt(L, 2) + ' cm'], ['চূড়ান্ত বিম্ব', inf ? 'অসীমে — অবাস্তব, উল্টো' : 'D = 25 cm দূরে — অবাস্তব, উল্টো']];
  } },
];

const nav = document.getElementById('nav'), host = document.getElementById('sim');
let current = null, state = {};
function setupCanvas(c, w, h){ const dpr = Math.min(2, window.devicePixelRatio||1); c.width = w*dpr; c.height = h*dpr; const x = c.getContext('2d'); x.scale(dpr,dpr); return x; }
function show(id){
  const sim = SIMS.find(s=>s.id===id); current = sim; state[id] = state[id] || Object.fromEntries(sim.ctrls.map(c=>[c.k,c.val]));
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===id));
  const V = state[id];
  host.innerHTML = `<h2>${sim.name}</h2><div class="stage"><canvas id="c1"></canvas></div>${sim.graph?'<div class="stage"><canvas id="c2"></canvas></div>':''}<div class="ctrl" id="ctrl"></div><div class="out" id="out"></div><p class="note">${sim.note}</p>`;
  const ctx = setupCanvas(document.getElementById('c1'), 800, sim.h), g = sim.graph ? setupCanvas(document.getElementById('c2'), 800, sim.graph) : null;
  const ctrl = document.getElementById('ctrl');
  sim.ctrls.forEach(c=>{
    const lab = document.createElement('label');
    if (c.type==='seg'){ lab.innerHTML = `${c.label}<div class="seg">${c.opts.map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${String(V[c.k])===String(v)}">${t}</button>`).join('')}</div>`;
      lab.querySelectorAll('button').forEach(b=>b.onclick=()=>{ V[c.k]=b.dataset.v; lab.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); }); }
    else { lab.innerHTML = `<span>${c.label} = <span class="v"></span></span><input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${V[c.k]}">`;
      const inp = lab.querySelector('input'), sp = lab.querySelector('.v'); const upd=()=>{ sp.textContent = (+V[c.k]).toString()+c.unit; };
      inp.oninput = ()=>{ V[c.k] = +inp.value; upd(); render(); }; upd(); }
    ctrl.appendChild(lab);
  });
  function render(){ clearC(ctx,800,sim.h); if(g) clearC(g,800,sim.graph); let o; try{ o = sim.draw(ctx, V, g) || []; }catch(e){ o=[['ত্রুটি', e.message]]; }
    document.getElementById('out').innerHTML = o.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join(''); }
  render(); current.render = render;
}
const groups = [...new Set(SIMS.map(s=>s.g))];
nav.innerHTML = groups.map(gr=>`<div class="grp"><div class="gl">${gr}</div><div class="row">${SIMS.filter(s=>s.g===gr).map(s=>`<button type="button" data-id="${s.id}" aria-selected="false">${s.name}</button>`).join('')}</div></div>`).join('');
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));
show('lens'); if (document.fonts) document.fonts.ready.then(()=>current&&current.render&&current.render());
</script></body></html>
