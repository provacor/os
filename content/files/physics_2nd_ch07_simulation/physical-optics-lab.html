<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ভৌত আলোকবিজ্ঞান ল্যাব — ৭ম অধ্যায়ের ১১টি সিমুলেশন</title>
<style>
  :root {
    --bg: #0d1017; --panel: #151a24; --panel2: #1c2230; --line: #2a3242; --text: #e9edf4; --muted: #8e98ab;
    --a: #7ea6ff; --b: #f7c35c; --c: #4fd8c4; --d: #fb8fb0; --e: #6ee7a0; --grid: rgba(255,255,255,.06);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --panel: #fff; --panel2: #f1f4f9; --line: #dde3ec; --text: #0f172a; --muted: #5b6577;
      --a: #3b6cf6; --b: #c58a06; --c: #0f9f8e; --d: #e2457a; --e: #16a34a; --grid: rgba(15,23,42,.07); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans Bengali", "Inter", system-ui, sans-serif; }
  header { padding: 14px 14px 6px; }
  h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 99px; padding: 7px 12px; font: inherit; font-size: .82rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--a); border-color: transparent; color: #fff; }
  main { padding: 6px 14px 24px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  h2 { margin: 2px 0 2px; font-size: 1.05rem; }
  .sub { color: var(--muted); font-size: .82rem; margin: 0 0 10px; }
  canvas { width: 100%; height: 260px; display: block; background: var(--panel2); border-radius: 12px; touch-action: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .row button.on { border-color: var(--a); color: var(--a); }
  .ctl { display: grid; gap: 8px; margin-top: 10px; }
  .ctl label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .84rem; }
  .ctl label b { color: var(--a); font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--a); }
  .info { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); font-size: .86rem; }
  .info code { font-family: ui-monospace, monospace; color: var(--c); }
  .info .big { font-size: 1.05rem; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>ভৌত আলোকবিজ্ঞান ল্যাব</h1>
  <p>পদার্থবিজ্ঞান ২য় পত্র · ৭ম অধ্যায় — নোটের প্রতিটি টপিকের হাতে-কলমে সিমুলেশন। স্লাইডার বদলে দেখো কী হয়।</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main><section class="card">
  <h2 id="title"></h2>
  <p class="sub" id="sub"></p>
  <canvas id="cv"></canvas>
  <div class="legend" id="legend"></div>
  <div class="row" id="buttons"></div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
  <p class="note" id="note"></p>
</section></main>

<script>
(() => {
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const bn = (x, d = 2) => {
    const s = typeof x === 'number' ? (Number.isInteger(x) ? String(x) : x.toFixed(d)) : String(x);
    return s.replace(/\d/g, (c) => '০১২৩৪৫৬৭৮৯'[c]);
  };
  const TAU = Math.PI * 2;

  // ---------- drawing helpers ----------
  function grid(w, h, midY = h / 2) {
    ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = midY % 40; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.strokeStyle = css('--line'); ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();
  }
  function curve(fn, x0, x1, color, width = 2.4, step = 2) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { const y = fn(x); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
  function dot(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function text(s, x, y, color = css('--muted'), size = 12, align = 'left') {
    ctx.fillStyle = color; ctx.font = `${size}px "Noto Sans Bengali", system-ui, sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
  }
  function arrowLine(x1, y1, x2, y2, color, label) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    for (const [ax, ay, bx] of [[x1, y1, x2], [x2, y2, x1]]) {
      const d = Math.sign(bx - ax) || 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + 7 * d, ay - 4); ctx.lineTo(ax + 7 * d, ay + 4); ctx.fill();
    }
    if (label) text(label, (x1 + x2) / 2, y1 - 6, color, 12, 'center');
  }

  // ---------- audio (optional, user starts it) ----------
  let audio = null;
  function playTones(freqs, gains) {
    stopTones();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = 0.18; out.connect(ac.destination);
    const oscs = freqs.map((f, i) => {
      const o = ac.createOscillator(); o.frequency.value = f;
      const g = ac.createGain(); g.gain.value = gains ? gains[i] : 1 / freqs.length;
      o.connect(g).connect(out); o.start(); return o;
    });
    audio = { ac, oscs };
    setTimeout(stopTones, 3500);
  }
  function stopTones() { if (audio) { try { audio.ac.close(); } catch (e) {} audio = null; } }

  // ---------- simulations ----------
  // ---------- optics helpers ----------
  const C0 = 2.998e8, H0 = 6.626e-34, EV = 1.602e-19, MU0 = 4 * Math.PI * 1e-7, EPS0 = 8.854e-12;
  const sup = (n) => String(n).replace(/[-0-9]/g, (c) => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]);
  function sci(x, d = 2) {
    if (!isFinite(x)) return '—';
    if (x === 0) return '০';
    const e = Math.floor(Math.log10(Math.abs(x)));
    if (e >= -2 && e < 4) return bn(Number(x.toFixed(d)), d);
    let m = x / 10 ** e;
    if (Math.abs(Number(m.toFixed(d))) >= 10) return `${bn(m / 10, d)} × 10${sup(e + 1)}`;
    return `${bn(m, d)} × 10${sup(e)}`;
  }
  const deg = (r) => (r * 180) / Math.PI, rad = (d) => (d * Math.PI) / 180;
  // wavelength (nm) -> [r,g,b] 0..1
  function wl(nm) {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; } else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; } else { r = 1; }
    const f = nm < 420 ? 0.3 + 0.7 * (nm - 380) / 40 : nm > 700 ? 0.3 + 0.7 * (780 - nm) / 80 : 1;
    return [r * f, g * f, b * f];
  }
  const rgb = (c, k = 1) => `rgb(${c.map((v) => Math.round(255 * Math.max(0, Math.min(1, v * k)))).join(',')})`;
  function colourName(nm) {
    return nm < 425 ? 'বেগুনি' : nm < 445 ? 'নীল' : nm < 500 ? 'আসমানি' : nm < 575 ? 'সবুজ' : nm < 585 ? 'হলুদ' : nm < 620 ? 'কমলা' : 'লাল';
  }
  function setParam(k, v) {
    const r = document.querySelector(`#ctl input[data-k="${k}"]`);
    if (!r) return;
    r.value = v; r.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function line(x1, y1, x2, y2, color, wdt = 1.5, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = wdt; if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
  }
  function arrow(x1, y1, x2, y2, color, wdt = 1.6) {
    line(x1, y1, x2, y2, color, wdt);
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 8 * Math.cos(a - 0.4), y2 - 8 * Math.sin(a - 0.4));
    ctx.lineTo(x2 - 8 * Math.cos(a + 0.4), y2 - 8 * Math.sin(a + 0.4)); ctx.fill();
  }
  // small axes box for a graph; returns mapper
  function graphBox(x0, y0, x1, y1, xmax, ymax, xl, yl) {
    line(x0, y1, x1, y1, css('--line'), 1); line(x0, y0, x0, y1, css('--line'), 1);
    if (xl) text(xl, x1, y1 + 13, css('--muted'), 10, 'right');
    if (yl) text(yl, x0 + 3, y0 + 9, css('--muted'), 10);
    return { X: (v) => x0 + (v / xmax) * (x1 - x0), Y: (v) => y1 - (v / ymax) * (y1 - y0) };
  }
  // screen strip + intensity plot shared by double slit / single slit
  function screenAndPlot(w, h, xs, view, I, colourAt, labels) {
    const top = 10, bot = h - 10, mid = h / 2, half = (bot - top) / 2;
    const yOf = (py) => ((mid - py) / half) * view;
    const gx0 = xs + 40, gx1 = w - 12;
    ctx.fillStyle = '#000'; ctx.fillRect(xs, top, 26, bot - top);
    const pts = [];
    for (let py = top; py < bot; py++) {
      const y = yOf(py + 0.5);
      ctx.fillStyle = colourAt(y); ctx.fillRect(xs, py, 26, 1);
      pts.push([gx0 + I(y) * (gx1 - gx0), py + 0.5]);
    }
    line(gx0, top, gx0, bot, css('--line'), 1);
    ctx.strokeStyle = css('--a'); ctx.lineWidth = 2; ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    text('পর্দা', xs + 13, bot + 0, css('--muted'), 10, 'center');
    text('তীব্রতা →', gx1, bot + 0, css('--muted'), 10, 'right');
    for (const [y, label, col] of labels) {
      if (Math.abs(y) > view) continue;
      const py = mid - (y / view) * half;
      line(xs + 26, py, gx0, py, css('--line'), 1, [2, 3]);
      text(label, xs + 29, py - 2, col ?? css('--muted'), 10);
    }
    return { yPx: (y) => mid - (y / view) * half };
  }

  // ---------- simulations ----------
  const S = [];

  S.push({
    id: 'phase', tab: '১. দশা ও পথ পার্থক্য',
    title: 'পথ পার্থক্য, দশা পার্থক্য ও উপরিপাতন',
    sub: 'একই কম্পাঙ্ক ও বিস্তারের দুটি তরঙ্গ একটি বিন্দুতে মিলিত হলো। দশা পার্থক্য δ = (2π/λ) × পথ পার্থক্য। লব্ধি বিস্তার R = 2a|cos(δ/2)|, আর তীব্রতা ∝ R²।',
    controls: [['dx', 'পথ পার্থক্য', 0, 3, 0.05, 0.25, 'λ'], ['A', 'প্রতিটি তরঙ্গের বিস্তার a', 10, 30, 1, 24, 'px']],
    legend: [['--a', '১ম তরঙ্গ'], ['--b', '২য় তরঙ্গ'], ['--d', 'লব্ধি তরঙ্গ']],
    height: 300,
    draw(w, h, t, p) {
      const lamPx = 120, k = TAU / lamPx, wt = TAU * 0.5 * t, d = TAU * p.dx;
      const ys = [h * 0.17, h * 0.42, h * 0.76];
      ctx.strokeStyle = css('--grid');
      for (const y of ys) line(0, y, w, y, css('--line'), 1);
      text('১ম তরঙ্গ', 6, ys[0] - p.A - 4, css('--a'), 11);
      text('২য় তরঙ্গ', 6, ys[1] - p.A - 4, css('--b'), 11);
      text('লব্ধি = ১ম + ২য়', 6, ys[2] - 2 * p.A - 4, css('--d'), 11);
      curve((x) => ys[0] - p.A * Math.sin(k * x - wt), 0, w, css('--a'), 2);
      curve((x) => ys[1] - p.A * Math.sin(k * x - wt - d), 0, w, css('--b'), 2);
      curve((x) => ys[2] - p.A * (Math.sin(k * x - wt) + Math.sin(k * x - wt - d)), 0, w, css('--d'), 2.6);
      const R = 2 * Math.abs(Math.cos(d / 2)), I = Math.cos(d / 2) ** 2;
      const m = p.dx * 2, r = Math.round(m);
      let verdict = 'আংশিক — পুরো উজ্জ্বলও না, পুরো অন্ধকারও না।';
      if (Math.abs(m - r) < 0.03) verdict = r % 2 === 0
        ? `<b>গঠনমূলক ব্যতিচার</b> — পথ পার্থক্য = ${bn(r)}·λ/2 (λ/2-এর যুগ্ম গুণিতক) → উজ্জ্বল`
        : `<b>ধ্বংসাত্মক ব্যতিচার</b> — পথ পার্থক্য = ${bn(r)}·λ/2 (λ/2-এর অযুগ্ম গুণিতক) → অন্ধকার`;
      this.info = `<span class="big">δ = (2π/λ) × ${bn(p.dx, 2)}λ = ${bn(p.dx * 2, 2)}π rad</span><br>` +
        `লব্ধি বিস্তার R = 2a|cos(δ/2)| = <b>${bn(R, 2)}a</b> · তীব্রতা = <b>${bn(I * 100, 0)}%</b> (সর্বোচ্চের)<br>${verdict}` +
        `<br><small>মনে রাখো: গঠনমূলক → δ = 2nπ; ধ্বংসাত্মক → δ = (2n+1)π (π/2 নয়)।</small>`;
    },
  });

  S.push({
    id: 'young', tab: '২. ইয়ং এর দ্বি-চিড়',
    title: 'ইয়ং এর দ্বি-চিড় পরীক্ষা',
    sub: 'সুসংগত আলো দুটি চিড় পেরিয়ে পর্দায় উজ্জ্বল-অন্ধকার ডোরা তৈরি করে। ডোরা ব্যবধান β = λD/a; n-তম উজ্জ্বল ডোরা Yₙ = nλD/a, n-তম অন্ধকার ডোরা Yₙ = (2n−1)λD/2a।',
    controls: [['lam', 'তরঙ্গদৈর্ঘ্য λ', 380, 780, 5, 589, 'nm'], ['a', 'চিড়দ্বয়ের দূরত্ব a', 0.1, 2, 0.05, 0.5, 'mm'], ['D', 'চিড় থেকে পর্দার দূরত্ব D', 0.5, 3, 0.1, 1, 'm'], ['n', 'ক্রম n', 1, 5, 1, 1, ''], ['view', 'পর্দার যতটুকু দেখাচ্ছে (±)', 2, 20, 1, 6, 'mm']],
    buttons: [['mono', 'একবর্ণী আলো', true, false, 'light'], ['white', 'সাদা আলো', false, false, 'light']],
    legend: [['--b', 'চিড় থেকে n-তম উজ্জ্বল ডোরায় যাওয়া রশ্মি']],
    height: 300,
    draw(w, h, t, p, b) {
      const mid = h / 2, xs = Math.max(150, w * 0.42);
      const phase = (y, nm) => (Math.PI * p.a * y) / (nm * 1e-6 * p.D * 1000); // all in mm
      const white = b.light === 'white';
      const WL = []; for (let nm = 400; nm <= 700; nm += 15) WL.push(nm);
      const I = (y) => white ? WL.reduce((s, nm) => s + Math.cos(phase(y, nm)) ** 2, 0) / WL.length : Math.cos(phase(y, p.lam)) ** 2;
      const colourAt = (y) => {
        if (!white) return rgb(wl(p.lam), Math.cos(phase(y, p.lam)) ** 2);
        const c = [0, 0, 0];
        for (const nm of WL) { const k = Math.cos(phase(y, nm)) ** 2, q = wl(nm); c[0] += q[0] * k; c[1] += q[1] * k; c[2] += q[2] * k; }
        return rgb(c, 2.6 / WL.length);
      };
      const beta = (p.lam * 1e-6 * p.D * 1000) / p.a; // mm
      const labels = [];
      if (!white) {
        labels.push([0, 'CM', css('--e')]);
        for (let k = 1; k <= 12; k++) { labels.push([k * beta, `${bn(k)}L`]); labels.push([-k * beta, `${bn(k)}L`]); }
        const pxPerMm = (h - 20) / 2 / p.view;
        if (beta * pxPerMm < 14) labels.splice(1);
      } else labels.push([0, 'সাদা', css('--e')]);
      const sp = screenAndPlot(w, h, xs, p.view, I, colourAt, labels);
      // apparatus
      const sx = 22, bx = Math.min(xs * 0.38, 90), g = 8 + p.a * 9;
      dot(sx, mid, 8, white ? '#fff' : rgb(wl(p.lam)));
      text('উৎস', sx, mid + 22, css('--muted'), 10, 'center');
      line(bx, 8, bx, mid - g - 3, css('--text'), 3); line(bx, mid - g + 3, bx, mid + g - 3, css('--text'), 3); line(bx, mid + g + 3, bx, h - 8, css('--text'), 3);
      text('S₁', bx - 14, mid - g + 4, css('--muted'), 10); text('S₂', bx - 14, mid + g + 4, css('--muted'), 10);
      for (const yy of [mid - g, mid + g]) line(sx, mid, bx, yy, css('--line'), 1, [3, 3]);
      const yn = p.n * beta;
      if (!white && yn <= p.view) {
        const py = sp.yPx(yn);
        line(bx, mid - g, xs, py, css('--b'), 1.4); line(bx, mid + g, xs, py, css('--b'), 1.4);
        dot(xs, py, 4, css('--b'));
      }
      line(bx, h - 14, xs, h - 14, css('--muted'), 1); text('D', (bx + xs) / 2, h - 18, css('--muted'), 11, 'center');
      const lam = p.lam * 1e-9, a = p.a * 1e-3;
      const yBright = (p.n * lam * p.D) / a * 1000, yDark = ((2 * p.n - 1) * lam * p.D) / (2 * a) * 1000, ang = lam / a;
      this.info = white
        ? 'সাদা আলোয় প্রতিটি রঙের ডোরা ব্যবধান আলাদা (β ∝ λ)। তাই কেন্দ্রীয় ডোরা সাদা, আর দুই পাশে রঙিন ডোরা — ভেতরের দিকে বেগুনি, বাইরের দিকে লাল।'
        : `<span class="big">ডোরা ব্যবধান β = λD/a = ${sci(beta, 3)} mm</span><br>` +
          `${bn(p.n)}-তম উজ্জ্বল ডোরা: Yₙ = nλD/a = <b>${sci(yBright, 3)} mm</b> · ${bn(p.n)}-তম অন্ধকার ডোরা: Yₙ = (2n−1)λD/2a = <b>${sci(yDark, 3)} mm</b><br>` +

      const wy = h - 34, px = 8 + ((p.L - lo) / (hi - lo)) * 150;
      curve((x) => wy - 14 * Math.sin((TAU * (x - x0)) / px - TAU * t), x0, x1, nm >= 380 && nm <= 780 ? rgb(wl(nm)) : css('--a'), 2);
      text('(তরঙ্গের ছবি প্রতীকী)', x1, h - 6, css('--muted'), 9, 'right');
      const band = BANDS.find(([a, b2]) => p.L >= a && p.L < b2) ?? BANDS[BANDS.length - 1];
      const nu = C0 / lam, E = (H0 * C0) / lam;
      this.info = `<span class="big">${band[2]}${nm >= 380 && nm <= 780 ? ` — ${colourName(nm)}` : ''}</span><br>` +
        `λ = ${sci(lam, 2)} m${nm >= 1 && nm < 1e5 ? ` (${sci(nm, 1)} nm)` : ''} · ν = c/λ = <b>${sci(nu, 2)} Hz</b><br>` +
        `শক্তি E = hc/λ = ${sci(E, 2)} J = <b>${sci(E / EV, 2)} eV</b><br>` +
        `উৎস: ${band[4]}<br>ব্যবহার: ${band[5]}`;
    },
  });

  S.push({
    id: 'lux', tab: '১১. দীপন তীব্রতা',
    title: 'দীপন তীব্রতা: E = P cosθ / r²',
    sub: 'P দীপন ক্ষমতার (ক্যান্ডেলা) উৎস থেকে r দূরত্বে রাখা তলে আলো θ কোণে পড়লে দীপন তীব্রতা E = P cosθ / r² (লাক্স)। দূরত্ব দ্বিগুণ হলে তীব্রতা এক-চতুর্থাংশ — বিপরীত বর্গ সূত্র।',
    controls: [['P', 'দীপন ক্ষমতা P', 10, 500, 10, 100, 'cd'], ['r', 'দূরত্ব r', 0.5, 5, 0.1, 1.5, 'm'], ['th', 'আপতন কোণ θ (অভিলম্বের সাথে)', 0, 80, 1, 0, '°']],
    legend: [['--a', 'E বনাম r (θ = ০°)'], ['--d', 'বর্তমান মান']],
    height: 280,
    draw(w, h, t, p) {
      const split = w > 480 ? w * 0.55 : w, my = h * (split === w ? 0.42 : 0.5), lx = 34, scale = (split - lx - 30) / 5;
      const E = (p.P * Math.cos(rad(p.th))) / (p.r * p.r);
      dot(lx, my, 10, '#ffd36b'); text('উৎস', lx, my + 26, css('--muted'), 10, 'center');
      const sx = lx + p.r * scale, half = 26, a = rad(p.th);
      const dx = half * Math.sin(a), dy = half * Math.cos(a);
      ctx.fillStyle = 'rgba(255,214,107,.12)'; ctx.beginPath(); ctx.moveTo(lx, my); ctx.lineTo(sx - dx, my - dy); ctx.lineTo(sx + dx, my + dy); ctx.fill();
      const br = Math.min(1, E / 200);
      line(sx - dx, my - dy, sx + dx, my + dy, `rgba(255,214,107,${0.25 + 0.75 * br})`, 6);
      line(sx, my, sx + 26 * Math.cos(a), my - 26 * Math.sin(a), css('--muted'), 1, [3, 3]);
      line(lx, my + 40, sx, my + 40, css('--muted'), 1); text(`r = ${bn(p.r, 1)} m`, (lx + sx) / 2, my + 54, css('--muted'), 10, 'center');
      if (split < w) {
        const g = graphBox(split + 26, 16, w - 12, h - 24, 5, Math.max(50, p.P / 0.25), 'r (m)', 'E (lux)');
        for (const v of [1, 2, 3, 4, 5]) text(bn(v), g.X(v), h - 10, css('--muted'), 9, 'center');
        curve((x) => g.Y(Math.min(p.P / 0.25, p.P / (((x - split - 26) / (w - 38 - split)) * 5) ** 2)), split + 28, w - 12, css('--a'), 2);
        dot(g.X(p.r), g.Y(E), 5, css('--d'));
      }
      this.info = `<span class="big">E = P cosθ / r² = ${bn(p.P, 0)} × cos${bn(p.th, 0)}° / ${bn(p.r, 1)}² = ${bn(E, 1)} lux</span><br>` +
        `r দ্বিগুণ করলে E = ${bn(E / 4, 1)} lux (এক-চতুর্থাংশ)।<br><small>আলোক প্রবাহের একক লুমেন; দীপন ক্ষমতা P = Q/4π (ক্যান্ডেলা)।</small>`;
    },
  });

  // ---------- runner ----------
  let cur = null, params = {}, btn = {}, t0 = performance.now(), paused = false;
  const $ = (id) => document.getElementById(id);
  $('tabs').innerHTML = S.map((s, i) => `<button data-i="${i}">${s.tab}</button>`).join('');
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(Number(b.dataset.i)); });

  function select(i) {
    stopTones();
    cur = S[i];
    document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('on', j === i));
    $('title').textContent = cur.title;
    $('sub').textContent = cur.sub;
    params = {}; btn = {};
    $('ctl').innerHTML = cur.controls.map(([k, label, min, max, step, val, unit]) => {
      params[k] = val;
      return `<label>${label}<b id="v_${k}">${bn(val, step < 0.01 ? 3 : step < 1 ? 2 : 0)} ${unit}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-k="${k}" data-u="${unit}" data-s="${step}"></label>`;
    }).join('');
    $('buttons').innerHTML = `<button data-b="pause">${paused ? '▶ চালাও' : '⏸ থামাও'}</button>` + (cur.buttons ?? []).map(([k, label, on, isAction, group]) => {
      if (group) { if (on) btn[group] = k; } else if (!isAction) btn[k] = on;
      return `<button data-b="${k}" ${group ? `data-g="${group}"` : ''} ${isAction ? 'data-a="1"' : ''} class="${on ? 'on' : ''}">${label}</button>`;
    }).join('');
    $('legend').innerHTML = (cur.legend ?? []).map(([c, l]) => `<span><i style="background:var(${c})"></i>${l}</span>`).join('');
    $('note').textContent = 'নোট: ছবিগুলো বোঝানোর জন্য মাপমতো আঁকা নয় এবং গতি ধীর করা হয়েছে; হিসাবগুলো সূত্র অনুযায়ী আসল মানে।';
    cv.style.height = `${cur.height ?? 260}px`;
    resize();
  }

  $('ctl').addEventListener('input', (e) => {
    const r = e.target; if (!r.dataset.k) return;
    params[r.dataset.k] = Number(r.value);
    const s = Number(r.dataset.s);
    $(`v_${r.dataset.k}`).textContent = `${bn(Number(r.value), s < 0.01 ? 3 : s < 1 ? 2 : 0)} ${r.dataset.u}`;
  });
  $('buttons').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.b;
    if (k === 'pause') { paused = !paused; b.textContent = paused ? '▶ চালাও' : '⏸ থামাও'; return; }
    if (b.dataset.a) { cur.action?.call(cur, k, params); return; }
    if (b.dataset.g) { btn[b.dataset.g] = k; document.querySelectorAll(`[data-g="${b.dataset.g}"]`).forEach((x) => x.classList.toggle('on', x === b)); return; }
    btn[k] = !btn[k]; b.classList.toggle('on', btn[k]);
  });

  let W = 0, H = 0, simT = 0, last = performance.now();
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) simT += dt;
    if (cur) {
      ctx.clearRect(0, 0, W, H);
      cur.draw(W, H, simT, params, btn);
      $('info').innerHTML = cur.info ?? '';
    }
    requestAnimationFrame(frame);
  }
  select(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
