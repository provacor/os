<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জৈব রসায়ন ল্যাব — ২য় অধ্যায়ের ৯টি সিমুলেশন</title>
<style>
  :root {
    --bg: #0d1017; --panel: #151a24; --panel2: #1c2230; --line: #2a3242; --text: #e9edf4; --muted: #8e98ab;
    --a: #7ea6ff; --b: #f7c35c; --c: #4fd8c4; --d: #fb8fb0; --e: #6ee7a0; --f: #c49bff; --grid: rgba(255,255,255,.06);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --panel: #fff; --panel2: #f1f4f9; --line: #dde3ec; --text: #0f172a; --muted: #5b6577;
      --a: #3b6cf6; --b: #c58a06; --c: #0f9f8e; --d: #e2457a; --e: #16a34a; --f: #7c3aed; --grid: rgba(15,23,42,.07); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Noto Sans Bengali", "Inter", system-ui, sans-serif; }
  header { padding: 14px 14px 6px; }
  h1 { margin: 0; font-size: 1.15rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .82rem; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px; scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 99px; padding: 7px 12px; font: inherit; font-size: .82rem; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--a); border-color: transparent; color: #fff; }
  main { padding: 6px 14px 24px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  h2 { margin: 2px 0 2px; font-size: 1.05rem; }
  .sub { color: var(--muted); font-size: .82rem; margin: 0 0 10px; }
  canvas { width: 100%; height: 300px; display: block; background: var(--panel2); border-radius: 12px; touch-action: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row .gl { width: 100%; font-size: .74rem; color: var(--muted); margin: 2px 0 -4px; }
  .row button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  .row button.on { border-color: var(--a); color: var(--a); }
  .ctl { display: grid; gap: 8px; margin-top: 10px; }
  .ctl label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .84rem; }
  .ctl label b { color: var(--a); font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--a); }
  .info { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); font-size: .86rem; }
  .info code { font-family: ui-monospace, monospace; color: var(--c); }
  .info .big { font-size: 1.05rem; font-weight: 700; }
  .info .ok { color: var(--e); font-weight: 700; }
  .info .no { color: var(--d); font-weight: 700; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>জৈব রসায়ন ল্যাব</h1>
  <p>রসায়ন ২য় পত্র · ২য় অধ্যায় — নোটের নিয়ম, ক্রম ও বিক্রিয়াগুলো হাতে-কলমে দেখো। বোতাম চাপো, স্লাইডার টানো; নিচের হিসাব সাথে সাথে বদলাবে।</p>
</header>
<nav class="tabs" id="tabs"></nav>
<main><section class="card">
  <h2 id="title"></h2>
  <p class="sub" id="sub"></p>
  <canvas id="cv"></canvas>
  <div class="row" id="buttons"></div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
  <p class="note" id="note"></p>
</section></main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  const BD = '০১২৩৪৫৬৭৮৯';
  const bn = (x) => String(x).replace(/\d/g, (c) => BD[c]);
  const SUB = '₀₁₂₃₄₅₆₇₈₉';
  const sub = (n) => (n === 1 ? '' : String(n).replace(/\d/g, (c) => SUB[c]));
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const ease = (t) => (t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t));
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---------- drawing helpers ----------
  function text(x, y, s, col = '--text', size = 15, weight = 600, align = 'center') {
    ctx.fillStyle = col.startsWith('--') ? css(col) : col;
    ctx.font = `${weight} ${size}px "Noto Sans Bengali", system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y);
  }
  function bond(x1, y1, x2, y2, order = 1, col = '--muted', s1 = 11, s2 = 11, w = 2) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, px = -uy, py = ux;
    const ax = x1 + ux * s1, ay = y1 + uy * s1, bx = x2 - ux * s2, by = y2 - uy * s2;
    ctx.strokeStyle = col.startsWith('--') ? css(col) : col; ctx.lineWidth = w; ctx.lineCap = 'round';
    const offs = order === 1 ? [0] : order === 2 ? [-2.6, 2.6] : [-4.5, 0, 4.5];
    for (const o of offs) { ctx.beginPath(); ctx.moveTo(ax + px * o, ay + py * o); ctx.lineTo(bx + px * o, by + py * o); ctx.stroke(); }
  }
  function dot(x, y, r, col) { ctx.fillStyle = col.startsWith('--') ? css(col) : col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  function ring(x, y, r, col) { ctx.strokeStyle = col.startsWith('--') ? css(col) : col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
  function poly(cx, cy, r, n, rot = -Math.PI / 2) {
    return Array.from({ length: n }, (_, i) => [cx + r * Math.cos(rot + (i * TAU) / n), cy + r * Math.sin(rot + (i * TAU) / n)]);
  }
  function arrow(x1, y1, x2, y2, col = '--b', w = 2) {
    const c = col.startsWith('--') ? css(col) : col;
    ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - 9 * Math.cos(a - 0.4), y2 - 9 * Math.sin(a - 0.4)); ctx.lineTo(x2 - 9 * Math.cos(a + 0.4), y2 - 9 * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill();
  }
  function hbar(x, y, w, h, frac, col, label) {
    ctx.fillStyle = css('--line'); ctx.fillRect(x, y, w, h);
    ctx.fillStyle = css(col); ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
    if (label) text(x - 6, y + h / 2, label, '--text', 13, 600, 'right');
  }
  function roundRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
  }

  // ---------- 1. homologous series ----------
  const PFX = ['মিথ', 'ইথ', 'প্রোপ', 'বিউট', 'পেন্ট', 'হেক্স', 'হেপ্ট', 'অক্ট', 'নন', 'ডেক'];
  const SERIES = {
    alkane: { label: 'অ্যালকেন', gen: 'CₙH₂ₙ₊₂', mf: 'M = 14n + 2', min: 1, M: (n) => 14 * n + 2, f: (n) => `C${sub(n)}H${sub(2 * n + 2)}`,
      name: (n) => PFX[n - 1] + 'েন', state: [[1, 4, 'গ্যাস'], [5, 17, 'তরল'], [18, 20, 'কঠিন']] },
    alkene: { label: 'অ্যালকিন', gen: 'CₙH₂ₙ', mf: 'M = 14n', min: 2, M: (n) => 14 * n, f: (n) => `C${sub(n)}H${sub(2 * n)}`,
      name: (n) => (n <= 3 ? PFX[n - 1] + 'িন' : PFX[n - 1] + '-1-ইন'), state: [[2, 4, 'গ্যাস'], [5, 15, 'তরল'], [16, 20, 'কঠিন']] },
    alkyne: { label: 'অ্যালকাইন', gen: 'CₙH₂ₙ₋₂', mf: 'M = 14n − 2', min: 2, M: (n) => 14 * n - 2, f: (n) => `C${sub(n)}H${sub(2 * n - 2)}`,
      name: (n) => (n <= 3 ? PFX[n - 1] + 'াইন' : PFX[n - 1] + '-1-আইন'), state: [[2, 4, 'গ্যাস'], [5, 11, 'তরল'], [12, 20, 'কঠিন']] },
    alcohol: { label: 'অ্যালকোহল', gen: 'CₙH₂ₙ₊₁OH', mf: 'M = 14n + 18', min: 1, M: (n) => 14 * n + 18, f: (n) => (n === 1 ? 'CH₃OH' : `C${sub(n)}H${sub(2 * n + 1)}OH`),
      name: (n) => (n <= 2 ? PFX[n - 1] + 'ানল' : PFX[n - 1] + 'ান-1-অল') },
    aldehyde: { label: 'অ্যালডিহাইড', gen: 'CₙH₂ₙO', mf: 'M = 14n + 16', min: 1, M: (n) => 14 * n + 16, f: (n) => (n === 1 ? 'HCHO' : `C${sub(n - 1)}H${sub(2 * n - 1)}CHO`),
      name: (n) => PFX[n - 1] + 'ান্যাল' },
    acid: { label: 'কার্বক্সিলিক এসিড', gen: 'CₙH₂ₙO₂', mf: 'M = 14n + 32', min: 1, M: (n) => 14 * n + 32, f: (n) => (n === 1 ? 'HCOOH' : `C${sub(n - 1)}H${sub(2 * n - 1)}COOH`),
      name: (n) => PFX[n - 1] + 'ানয়িক এসিড', state: [[1, 9, 'তরল'], [10, 20, 'কঠিন']] },
  };

  const sims = [];

  sims.push({
    title: 'সমগোত্রীয় শ্রেণি: সংকেত, আণবিক ভর ও ভৌত অবস্থা',
    sub: 'শ্রেণি বেছে n (কার্বন সংখ্যা) টানো — সাধারণ সংকেত, আণবিক ভর M ও ভৌত অবস্থা সাথে সাথে বদলাবে। পাশাপাশি দুই সদস্যের পার্থক্য সবসময় –CH₂– (ভর 14)।',
    groups: [['s', 'শ্রেণি', Object.entries(SERIES).map(([k, v]) => [k, v.label]), 'alkane']],
    controls: [['n', 'কার্বন সংখ্যা n', 1, 20, 1, 4, '']],
    draw(W, H, t, p, g) {
      const S = SERIES[g.s];
      const n = Math.max(S.min, p.n);
      const step = Math.min(42, (W - 120) / Math.max(n, 2));
      const x0 = W / 2 - (step * (n - 1)) / 2, yA = H * 0.36, yB = H * 0.36 + 26;
      const pts = Array.from({ length: n }, (_, i) => [x0 + i * step, i % 2 ? yB : yA]);
      for (let i = 0; i < n - 1; i++) {
        const order = i === 0 && g.s === 'alkene' ? 2 : i === 0 && g.s === 'alkyne' ? 3 : 1;
        bond(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], order, order > 1 ? '--a' : '--muted', 8, 8, 2.2);
      }
      pts.forEach(([x, y], i) => { dot(x, y, 8, i === 0 && g.s !== 'alkane' ? '--a' : '--c'); text(x, y, 'C', '#06121c', 10, 800); });
      const [fx, fy] = pts[0];
      if (g.s === 'alcohol') { bond(fx, fy, fx - 34, fy - 26, 1, '--d', 8, 10); text(fx - 48, fy - 34, 'OH', '--d', 15, 800); }
      if (g.s === 'aldehyde') { bond(fx, fy, fx - 34, fy - 26, 2, '--d', 8, 10); text(fx - 42, fy - 34, 'O', '--d', 15, 800); text(fx - 26, fy + 16, 'H', '--muted', 13); }
      if (g.s === 'acid') { bond(fx, fy, fx - 34, fy - 26, 2, '--d', 8, 10); text(fx - 42, fy - 34, 'O', '--d', 15, 800); bond(fx, fy, fx - 34, fy + 22, 1, '--d', 8, 10); text(fx - 50, fy + 28, 'OH', '--d', 15, 800); }
      text(W / 2, 30, `${S.f(n)}   ·   M = ${bn(S.M(n))} g mol⁻¹`, '--text', 18, 800);
      if (S.state) {
        const bx = 40, bw = W - 80, by = H - 62;
        const col = { 'গ্যাস': '--c', 'তরল': '--a', 'কঠিন': '--b' };
        S.state.forEach(([a, b, s]) => {
          const xa = bx + ((a - 1) / 20) * bw, xb = bx + (b / 20) * bw;
          ctx.fillStyle = css(col[s]); ctx.globalAlpha = 0.35; ctx.fillRect(xa, by, xb - xa, 18); ctx.globalAlpha = 1;
          text((xa + xb) / 2, by + 9, s, '--text', 12, 700);
        });
        const mx = bx + ((n - 0.5) / 20) * bw;
        ctx.fillStyle = css('--d'); ctx.beginPath(); ctx.moveTo(mx, by - 2); ctx.lineTo(mx - 6, by - 12); ctx.lineTo(mx + 6, by - 12); ctx.fill();
        text(bx, by + 32, 'C₁', '--muted', 11, 600, 'left'); text(bx + bw, by + 32, 'C₂₀', '--muted', 11, 600, 'right');
        text(W / 2, by + 32, 'কক্ষ তাপমাত্রায় ভৌত অবস্থা (নোটের সারণি)', '--muted', 11);
      } else {
        text(W / 2, H - 50, 'এই শ্রেণির ভৌত অবস্থার সীমা নোটে আলাদা করে দেওয়া নেই', '--muted', 12);
      }
      const st = S.state?.find(([a, b]) => n >= a && n <= b)?.[2];
      const nm = n <= 10 ? S.name(n) : '— (n > 10: শুধু সংকেত দেখাও)';
      this.info = `<span class="big">${S.label}: ${S.gen}</span> · <code>${S.mf}</code><br>
        n = ${bn(n)} → <b>${S.f(n)}</b>, নাম: <b>${nm}</b><br>
        আণবিক ভর: ${bn(S.mf.replace('M = ', '').replace('n', ` × ${n}`))} = <b>${bn(S.M(n))}</b> g mol⁻¹${st ? ` · অবস্থা: <b>${st}</b>` : ''}
        ${p.n < S.min ? `<br><span class="no">এই শ্রেণির প্রথম সদস্য n = ${bn(S.min)} থেকে শুরু।</span>` : ''}`;
    },
  });

  // ---------- 2. Hückel ----------
  const HUCKEL = {
    benzene: { label: 'বেনজিন', rings: 1, size: 6, pi: 6, calc: '6', cyc: true, deloc: true, arom: true },
    naph: { label: 'ন্যাফথালিন', rings: 2, size: 6, pi: 10, calc: '10', cyc: true, deloc: true, arom: true },
    anth: { label: 'অ্যানথ্রাসিন', rings: 3, size: 6, pi: 14, calc: '14', cyc: true, deloc: true, arom: true },
    pyridine: { label: 'পিরিডিন', rings: 1, size: 6, pi: 6, calc: '6 + 0', het: 'N', cyc: true, deloc: true, arom: true },
    furan: { label: 'ফিউরান', rings: 1, size: 5, pi: 6, calc: '4 + 2 (O এর নিঃসঙ্গ জোড়)', het: 'O', cyc: true, deloc: true, arom: true },
    pyrrole: { label: 'পাইরোল', rings: 1, size: 5, pi: 6, calc: '4 + 2 (N এর নিঃসঙ্গ জোড়)', het: 'NH', cyc: true, deloc: true, arom: true },
    thio: { label: 'থায়োফিন', rings: 1, size: 5, pi: 6, calc: '4 + 2 (S এর নিঃসঙ্গ জোড়)', het: 'S', cyc: true, deloc: true, arom: true },
    cpcat: { label: 'সাইক্লোপ্রোপিনাইল ক্যাটায়ন', rings: 1, size: 3, pi: 2, calc: '2', charge: '+', cyc: true, deloc: true, arom: true },
    cp: { label: 'সাইক্লোপ্রোপিন', rings: 1, size: 3, pi: 2, calc: '2 (একটি sp³ C)', cyc: true, deloc: false, arom: false },
    cpan: { label: 'সাইক্লোপ্রোপিনাইল অ্যানায়ন', rings: 1, size: 3, pi: 4, calc: '2 + 2', charge: '−', cyc: true, deloc: null, arom: false },
    cbd: { label: 'সাইক্লোবিউটাডাইন', rings: 1, size: 4, pi: 4, calc: '4', cyc: true, deloc: null, arom: false },
  };
  const isHuckel = (e) => e >= 2 && (e - 2) % 4 === 0;
  sims.push({
    title: 'হাকেল নীতি (4n + 2) — কোন যৌগ অ্যারোমেটিক?',
    sub: 'অণু বেছে নাও: বলয়ে সঞ্চরণশীল π ইলেকট্রন ঘুরছে কিনা আর সংখ্যাটি 4n + 2 কিনা দেখো। নিচের স্লাইডারে যেকোনো π ইলেকট্রন সংখ্যা যাচাই করো।',
    groups: [['m', 'অণু', Object.entries(HUCKEL).map(([k, v]) => [k, v.label]), 'benzene']],
    controls: [['e', 'নিজে যাচাই: π ইলেকট্রন সংখ্যা', 0, 22, 1, 6, 'টি']],
    draw(W, H, t, p, g) {
      const M = HUCKEL[g.m];
      const r = M.size === 6 ? Math.min(52, H * 0.2) : M.size === 5 ? 50 : M.size === 4 ? 46 : 44;
      const cy = H * 0.44;
      const dx = r * Math.sqrt(3);
      const centers = Array.from({ length: M.rings }, (_, i) => [W / 2 + (i - (M.rings - 1) / 2) * dx, cy]);
      const rot = M.size === 6 ? -Math.PI / 2 : M.size === 4 ? -Math.PI / 4 : -Math.PI / 2;
      const allV = [];
      centers.forEach(([cx, cyy]) => {
        const v = poly(cx, cyy, r, M.size, rot);
        allV.push(v);
        v.forEach((a, i) => { const b = v[(i + 1) % v.length]; bond(a[0], a[1], b[0], b[1], 1, '--muted', 0, 0, 2.4); });
        if (M.size === 4) { bond(v[0][0], v[0][1], v[1][0], v[1][1], 2, '--muted', 0, 0, 2.4); bond(v[2][0], v[2][1], v[3][0], v[3][1], 2, '--muted', 0, 0, 2.4); }
        if (g.m === 'cp') bond(v[1][0], v[1][1], v[2][0], v[2][1], 2, '--muted', 0, 0, 2.4);
      });
      if (M.het) { const [hx, hy] = allV[0][0]; dot(hx, hy, 13, '--panel2'); text(hx, hy, M.het, '--d', 15, 800); }
      if (g.m === 'cp') { const [hx, hy] = allV[0][0]; text(hx, hy - 16, 'CH₂ (sp³)', '--b', 12, 700); }
      if (M.charge) text(centers[0][0] + r + 14, cy - r, M.charge, '--d', 22, 800);
      // π electrons
      const perRing = Math.ceil(M.pi / M.rings);
      let left = M.pi;
      centers.forEach(([cx, cyy], k) => {
        const cnt = Math.min(perRing, left); left -= cnt;
        for (let i = 0; i < cnt; i++) {
          const base = (i / cnt) * TAU + (k % 2 ? Math.PI / cnt : 0);
          const a = M.deloc ? base + t * 1.2 * (k % 2 ? -1 : 1) : base;

        ctx.globalAlpha = pop;
        roundRect(x + 2, y + 2, cw - 4, chh - 4, 6, css(isM ? '--line' : i % 2 ? '--d' : '--a'));
        if (cw > 30) text(x + cw / 2, y + chh / 2, isM ? 'মেসো' : i % 2 ? 'l' : 'd', '#fff', 11, 800);
        ctx.globalAlpha = 1;
      }
      if (total > cells) text(W / 2, H - 14, `(${bn(total)}টির মধ্যে প্রথম ${bn(cells)}টি দেখানো হলো)`, '--muted', 11);
      text(W / 2, 22, `মোট আলোক সমাণু = ${bn(total)}`, '--text', 17, 800);
      text(W / 2, 42, 'নীল = d, গোলাপি = l (প্রতি জোড়া এনানশিওমার), ধূসর = মেসো (আলোক নিষ্ক্রিয়)', '--muted', 11);
      this.info = `<span class="big">n = ${bn(n)} (${g.k === 'u' || n < 2 ? 'অসদৃশ' : 'সদৃশ'} কাইরাল C)</span><br>
        আলোক সক্রিয়: <code>${bn(f1)}</code> · এনানশিওমার জোড়া = ${bn(pairs)}<br><code>${bn(f2)}</code>
        ${g.k === 's' && n < 2 ? '<br><span class="no">সদৃশ কাইরাল কেন্দ্রের জন্য অন্তত ২টি কাইরাল C লাগে।</span>' : ''}<br>
        উদাহরণ: ল্যাকটিক এসিড (n = ১) → ২; টারটারিক এসিড (n = ২, সদৃশ) → ২টি সক্রিয় + ১টি মেসো; গ্লুকোজ (n = ৪, অসদৃশ) → ১৬।`;
    },
  });
  function sup(n) { return String(n).replace(/\d/g, (c) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]); }

  // ---------- 9. nucleophilic addition to carbonyl ----------
  const CO = [
    { k: 'hcho', L: 'H', R: 'H', name: 'HCHO (মিথান্যাল)' },
    { k: 'ald', L: 'CH₃', R: 'H', name: 'CH₃CHO (ইথান্যাল)' },
    { k: 'acet', L: 'CH₃', R: 'CH₃', name: 'CH₃COCH₃ (প্রোপানোন)' },
    { k: 'mek', L: 'CH₃', R: 'C₂H₅', name: 'CH₃COC₂H₅ (বিউটানোন)' },
    { k: 'dek', L: 'C₂H₅', R: 'C₂H₅', name: 'C₂H₅COC₂H₅ (পেন্টান-3-ওন)' },
  ];
  sims.push({
    title: 'কার্বনিল যৌগে কেন্দ্রাকর্ষী (Nₚ) সংযোজন',
    sub: 'কার্বনিল যৌগ বেছে নাও। কার্বনিল C এর আংশিক ধনাত্মক চার্জ (δ+) যত বেশি এবং স্টেরিক বাধা যত কম, Nu⁻ তত সহজে আক্রমণ করে।',
    groups: [['c', 'যৌগ', CO.map((c) => [c.k, c.name]), 'hcho']],
    draw(W, H, t, p, g) {
      const i = CO.findIndex((c) => c.k === g.c), C = CO[i];
      const nar = W < 560, cx = nar ? W / 2 : W * 0.38, cy = nar ? H * 0.42 : H * 0.5;
      const ph = (t % 4) / 4;
      const dplus = 1 - i * 0.18;
      ctx.globalAlpha = 0.18 + 0.25 * dplus; dot(cx, cy, 30 * dplus + 10, '--b'); ctx.globalAlpha = 1;
      text(cx, cy, 'C', '--text', 18, 800); text(cx + 16, cy - 18, 'δ+', '--b', 12, 800);
      bond(cx, cy, cx, cy - 56, 2, '--d', 12, 10); text(cx, cy - 66, 'O', '--d', 18, 800); text(cx + 16, cy - 72, 'δ−', '--d', 12, 800);
      const bulk = (s) => (s === 'H' ? 6 : s === 'CH₃' ? 14 : 20);
      [[C.L, -1], [C.R, 1]].forEach(([s, sd]) => {
        const x = cx + sd * 62, y = cy + 40;
        ctx.globalAlpha = 0.15; dot(x, y, bulk(s) + 8, '--muted'); ctx.globalAlpha = 1;
        bond(cx, cy, x, y, 1, '--muted', 12, 14); text(x, y, s, '--text', 15, 800);
      });
      const reach = ease(clamp(ph / 0.6, 0, 1)) * (0.4 + 0.6 * dplus);
      text(lerp(nar ? W - 24 : cx + 200, cx + 30, reach), lerp(cy + 10, cy + 2, reach), 'Nu⁻', '--c', 16, 800);
      // ranking
      const bx = W * 0.68, bw = W * 0.26;
      text(nar ? W / 2 : bx + bw / 2, nar ? H - 50 : 22, 'Nₚ সংযোজনে সক্রিয়তার ক্রম', '--muted', 12, 700);
      if (nar) {
        const cw = (W - 16) / CO.length;
        CO.forEach((c, j) => { roundRect(8 + j * cw + 2, H - 36, cw - 4, 26, 6, css(j === i ? '--a' : '--line')); text(8 + j * cw + cw / 2, H - 23, c.name.split(' ')[0], j === i ? '#fff' : '--muted', 9, 700); });
      } else CO.forEach((c, j) => {
        const y = 44 + j * ((H - 70) / CO.length);
        hbar(bx, y + 12, bw, 10, 1 - j * 0.18, j === i ? '--a' : '--line');
        text(bx, y, `${bn(j + 1)}. ${c.name.split(' ')[0]}`, j === i ? '--text' : '--muted', 12, j === i ? 800 : 500, 'left');
      });
      this.info = `<span class="big">${C.name} — ক্রমে ${bn(i + 1)} নম্বর</span><br>
        ক্রম: <code>HCHO > CH₃CHO > CH₃COCH₃ > CH₃COC₂H₅ > C₂H₅COC₂H₅</code><br>
        কারণ: HCHO তে কোনো e⁻ দাতা অ্যালকাইল গ্রুপ নেই, তাই কার্বনিল C এ (+) চার্জ বেশি ও স্টেরিক বাধা কম; অ্যালকাইল গ্রুপ বাড়লে (+) চার্জ কমে ও স্টেরিক বাধা বাড়ে। (বার = গুণগত ক্রম)`;
    },
  });

  // ---------- framework ----------
  let cur = null, params = {}, grp = {}, paused = false;
  $('tabs').innerHTML = sims.map((s, i) => `<button data-i="${i}">${bn(i + 1)}. ${s.title.split(/[:—(]/)[0].trim()}</button>`).join('');
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(Number(b.dataset.i)); });

  function select(i) {
    cur = sims[i];
    document.querySelectorAll('#tabs button').forEach((b, j) => b.classList.toggle('on', j === i));
    $('title').textContent = cur.title;
    $('sub').textContent = cur.sub;
    params = {}; grp = {};
    $('ctl').innerHTML = (cur.controls ?? []).map(([k, label, min, max, step, val, unit]) => {
      params[k] = val;
      return `<label>${label}<b id="v_${k}">${bn(val)} ${unit}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-k="${k}" data-u="${unit}"></label>`;
    }).join('');
    $('buttons').innerHTML = `<button data-b="pause">${paused ? '▶ চালাও' : '⏸ থামাও'}</button>` + (cur.groups ?? []).map(([gk, glabel, opts, def]) => {
      grp[gk] = def;
      return `<span class="gl">${glabel}</span>` + opts.map(([k, l]) => `<button data-g="${gk}" data-b="${k}" class="${k === def ? 'on' : ''}">${l}</button>`).join('');
    }).join('');
    $('note').textContent = 'নোট: অ্যানিমেশন ও বারগুলো ধারণা বোঝানোর জন্য (গুণগত); সংকেত, ক্রম ও পরীক্ষার ফল অধ্যায়ের নোট থেকে নেওয়া।';
    resize();
  }

  $('ctl').addEventListener('input', (e) => {
    const r = e.target; if (!r.dataset.k) return;
    params[r.dataset.k] = Number(r.value);
    $(`v_${r.dataset.k}`).textContent = `${bn(r.value)} ${r.dataset.u}`;
  });
  $('buttons').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.b === 'pause') { paused = !paused; b.textContent = paused ? '▶ চালাও' : '⏸ থামাও'; return; }
    const gk = b.dataset.g; if (!gk) return;
    grp[gk] = b.dataset.b; simT = 0;
    document.querySelectorAll(`[data-g="${gk}"]`).forEach((x) => x.classList.toggle('on', x === b));
  });

  let W = 0, H = 0, simT = 0, last = performance.now();
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  let lastInfo = '';
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) simT += dt;
    if (cur && W > 0) {
      ctx.clearRect(0, 0, W, H);
      cur.draw(W, H, simT, params, grp);
      if (cur.info !== lastInfo) { $('info').innerHTML = cur.info ?? ''; lastInfo = cur.info; }
    }
    requestAnimationFrame(frame);
  }
  select(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
