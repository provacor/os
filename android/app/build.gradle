// pb Android app: one full-screen WebView (MainActivity) showing the live site; the site's service
// worker makes it work offline after the first launch. No libraries, so the APK stays tiny.
// Built and published by .github/workflows/android.yml.
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.provacor.pb'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.provacor.pb'
        minSdk 24   // service workers (offline mode) in WebView need Android 7+
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "1.${versionCode}"
    }

    signingConfigs {
        release {
            // The key is never stored in the repo: CI writes it from the PB_KEYSTORE_BASE64 secret
            // (or, until that secret exists, from a throwaway key made for that one build).
            storeFile file(System.getenv('PB_KEYSTORE_FILE') ?: 'pb-release.jks')
            storePassword System.getenv('PB_KEYSTORE_PASSWORD')
            keyAlias System.getenv('PB_KEY_ALIAS') ?: 'pb'
            keyPassword System.getenv('PB_KEY_PASSWORD') ?: System.getenv('PB_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // drops unused code: smaller APK
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

