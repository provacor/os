<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Provacor অ্যাপ ডাউনলোড</title>
<style>
  :root { --bg: #0a0c11; --panel: #151a24; --line: #2a3242; --text: #e9edf4; --muted: #8e98ab; --a: #7c74ff; --bad: #fb7185; --ok: #4ade80; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fa; --panel: #fff; --line: #dde3ec; --text: #0f172a; --muted: #5b6577; --a: #4f46e5; --bad: #e11d48; --ok: #16a34a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.55 "Noto Sans Bengali", system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .logo { width: 56px; height: 56px; }
  h1 { font-size: 1.25rem; margin: 10px 0 4px; }
  p { margin: 0 0 14px; color: var(--muted); font-size: .92rem; }
  label { display: block; font-size: .9rem; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  button { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; background: var(--a); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.5em; margin-top: 12px; font-size: .92rem; }
  .bad { color: var(--bad); } .ok { color: var(--ok); }
  ol { padding-left: 1.2em; margin: 16px 0 0; color: var(--muted); font-size: .86rem; }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#4f46e5"/><path d="M12 26 32 16l20 10-20 10z" fill="#fff"/><path d="M20 31v9c0 3 6 6 12 6s12-3 12-6v-9l-12 6z" fill="#c7c4ff"/></svg>
  <h1>Provacor অ্যান্ড্রয়েড অ্যাপ</h1>
  <p id="meta">ফাইলটা পাসওয়ার্ড দিয়ে লক করা — পাসওয়ার্ড ছাড়া কেউ নামাতে পারবে না।</p>
  <form id="f">
    <label for="pw">পাসওয়ার্ড</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">ডাউনলোড</button>
  </form>
  <div id="msg" role="status"></div>
  <ol>
    <li>ডাউনলোড শেষ হলে <b>provacor.apk</b> ফাইলটা খোলো।</li>
    <li>"অজানা উৎস থেকে ইনস্টল" চাইলে Chrome-কে অনুমতি দাও।</li>
    <li>Install চাপো। নতুন ভার্শন একইভাবে ইনস্টল করলে আগের পড়ার ডেটা থেকে যাবে।</li>
  </ol>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const bn = (s) => String(s).replace(/\d/g, (d) => '০১২৩৪৫৬৭৮৯'[d]);
  const say = (t, cls = '') => { $('msg').className = cls; $('msg').textContent = t; };
  let iterations = 600000;
  fetch('apk.json', { cache: 'no-cache' }).then((r) => r.json()).then((m) => {
    iterations = m.iterations ?? iterations;
    $('meta').textContent = `ভার্শন ${bn(m.version)} · ${bn((m.bytes / 1e6).toFixed(1))} MB · পাসওয়ার্ড দিয়ে লক করা।`;
  }).catch(() => {});

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!crypto?.subtle) return say('এই ব্রাউজার এটা পারে না — Chrome দিয়ে খোলো।', 'bad');
    $('go').disabled = true;
    try {
      say('ফাইল নামানো হচ্ছে…');
      const res = await fetch('provacor.apk.enc', { cache: 'no-cache' });
      if (!res.ok) throw new Error('missing');
      const buf = new Uint8Array(await res.arrayBuffer());
      if (String.fromCharCode(...buf.slice(0, 4)) !== 'PVC1') throw new Error('format');
      say('পাসওয়ার্ড মেলানো হচ্ছে…');
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: buf.slice(4, 20), iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      let apk;
      try {
        apk = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(20, 32) }, key, buf.slice(32));
      } catch {
        return say('পাসওয়ার্ড ভুল।', 'bad');
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([apk], { type: 'application/vnd.android.package-archive' }));
      a.download = 'provacor.apk';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
      say('ডাউনলোড হয়েছে — এখন ফাইলটা খুলে Install চাপো।', 'ok');
    } catch {
      say('ফাইলটা পাওয়া গেল না — নেট চেক করে আবার চেষ্টা করো।', 'bad');
    } finally {
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
