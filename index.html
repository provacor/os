  <script>
    try {
      var a = JSON.parse(localStorage.getItem('hscos:a11y:v1') || '{}'), h = document.documentElement;
      h.style.setProperty('--fs', a.font || 1);
      h.dataset.dyslexia = a.dyslexia ? 'on' : 'off';
      h.dataset.contrast = a.contrast ? 'high' : 'normal';
      h.dataset.motion = a.motion || 'system';
      var b = Math.min(130, Math.max(50, Number(a.bright) || 100));
      h.style.setProperty('--dim', b < 100 ? (100 - b) / 100 : 0);
      h.style.setProperty('--boost', b > 100 ? b / 100 : 1);
      h.dataset.bright = b === 100 ? 'normal' : b < 100 ? 'dim' : 'boost';
    } catch (e) {}
    try {
      var p = localStorage.getItem('hscos:theme') || 'dark';
      if (p === 'system') p = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = p;
    } catch (e) {}
  </script>
