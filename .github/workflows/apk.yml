# Builds the unsigned Android app with the official Android SDK and pushes it to the
# `apk-unsigned` branch. Signing and the password lock happen locally (tools/apk/build.py sign),
# so the key and password are never on GitHub.
name: APK (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install --quiet cryptography pillow
      - run: python3 tools/apk/build.py compile --sdk "$ANDROID_HOME" --out "$RUNNER_TEMP/unsigned.apk"
      - name: Push to the apk-unsigned branch
        run: |
          cd "$RUNNER_TEMP"
          git init -q out && cd out
          cp ../unsigned.apk .
          git add unsigned.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Unsigned APK from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:apk-unsigned
