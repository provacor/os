# Builds the pb Android app (APK) and publishes it as a GitHub release, so the latest APK is
# always at https://github.com/provacor/p-b/releases/latest/download/pb.apk
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: android   # the study content is large and not needed for the APK

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Signing key: the PB_KEYSTORE_BASE64 / PB_KEYSTORE_PASSWORD repository secrets when they are
      # set (same key every build, so installed apps update in place). Without them a throwaway key
      # is made for this build only; the APK still installs, but updating needs an uninstall first.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.PB_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.PB_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/pb-release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "PB_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::PB_KEYSTORE_BASE64 secret not set: signing with a one-off key"
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -alias pb -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=pb, O=pb, C=BD"
            echo "PB_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "PB_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build signed APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk pb.apk

      - name: Keep the APK of a pull request build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pb-apk
          path: pb.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: pb Android app v1.${{ github.run_number }}
          body: Android অ্যাপ (APK)। ফোনে pb.apk ডাউনলোড করে খুলুন, "Install" চাপুন।
          files: pb.apk
          make_latest: true
